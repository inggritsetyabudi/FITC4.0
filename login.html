<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — Posyandu Pintar</title>
    <meta
      name="description"
      content="Halaman masuk Posyandu Pintar untuk Kader, Bidan, dan Admin Posyandu Desa."
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body class="login-body">
    <div class="login-page">
      <div class="login-image-panel">
        <img src="assets/images/hero_bidan.jpg" alt="Pelayanan Posyandu" />

        <div class="login-image-overlay">
          <a href="index.html" class="login-brand">
            <div class="login-logo">
              <i class="bi bi-heart-pulse-fill"></i>
            </div>

            <div>
              <strong>Posyandu Pintar</strong>
            </div>
          </a>

          <div class="login-image-content">
            <span class="login-image-label">POSYANDU PINTAR</span>
            <h1>Pencatatan lebih rapi, pemantauan lebih mudah.</h1>

            <p>
              Kelola data balita, penimbangan, dan pemantauan tumbuh kembang
              dalam satu sistem.
            </p>
          </div>
        </div>
      </div>

      <div class="login-form-panel">
        <div class="login-card">
          <div class="login-header">
            <div class="login-mobile-logo">
              <div class="login-logo">
                <i class="bi bi-heart-pulse-fill"></i>
              </div>
            </div>

            <span class="login-welcome">SELAMAT DATANG</span>

            <h2 class="h4 mb-1">Masuk ke Posyandu Pintar</h2>

            <p class="text-ink-500 font-sm mb-0">
              Silakan masukkan akun petugas Posyandu Anda
            </p>
          </div>

          <div
            id="loginAlert"
            class="alert alert-danger font-sm py-2 px-3 mb-3"
            style="display: none; border-radius: var(--radius-md)"
          ></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="inputUsername" class="form-label">
                Nama Pengguna / Akun
                <span class="required-mark">*</span>
              </label>

              <input
                type="text"
                id="inputUsername"
                class="form-control-posyandu"
                placeholder="Contoh: kader / bidan / admin"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-3">
              <label for="inputPassword" class="form-label">
                Kata Sandi
                <span class="required-mark">*</span>
              </label>

              <input
                type="password"
                id="inputPassword"
                class="form-control-posyandu"
                placeholder="Masukkan kata sandi"
                autocomplete="current-password"
                required
              />
            </div>

            <button
              type="submit"
              id="btnSubmitLogin"
              class="btn-posyandu-primary w-100 mb-2"
            >
              <i class="bi bi-box-arrow-in-right"></i>
              Masuk
            </button>

            <a href="index.html" class="btn-posyandu-secondary w-100">
              Kembali ke Beranda
            </a>
          </form>

          <div class="demo-account-box">
            <div class="demo-account-title">
              <i class="bi bi-person-badge"></i>
              Akun Demo
            </div>

            <div class="demo-chips">
              <button
                type="button"
                class="demo-chip js-demo-chip"
                data-user="kader"
                data-pass="123"
              >
                Kader (Bu Sari)
              </button>

              <button
                type="button"
                class="demo-chip js-demo-chip"
                data-user="bidan"
                data-pass="123"
              >
                Bidan (Bidan Siti)
              </button>

              <button
                type="button"
                class="demo-chip js-demo-chip"
                data-user="admin"
                data-pass="123"
              >
                Admin Desa
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/components/toast.js"></script>
    <script src="assets/js/components/dialog.js"></script>
    <script src="assets/js/services/auth-service.js"></script>
    <script src="assets/js/pages/login.js"></script>
  </body>
</html>
